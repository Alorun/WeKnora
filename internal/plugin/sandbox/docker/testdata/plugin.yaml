apiVersion: plugins.weknora.io/v1alpha1
kind: Plugin
metadata:
  id: test.runtime-probe
  name: Runtime probe
  version: 1.0.0
spec:
  protocolVersion: "1.0"
  compatibility:
    weknora: ">=0.7.2 <0.8.0"
  extension:
    id: runtime_probe
    type: datasource
    contractVersion: "1.0"
    capabilities: [full_sync]
  runtime:
    kind: sandbox_service
    entrypoint: plugin
    transport: uds
  permissions:
    network: none
    filesystem: selected_directory_readonly
  resources:
    memoryMiB: 256
    cpuQuota: 0.5
    maxProcesses: 32
  configSchema:
    type: object
    additionalProperties: false
    properties:
      source_grant:
        type: string
